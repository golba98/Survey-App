<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Putting the South African Economy Into Perspective</title>
  <desc>Social share card for the anonymous South African cost-of-living survey.</desc>

  <defs>
    <radialGradient id="pageGlow" cx="50%" cy="0%" r="78%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="48%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#272727"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
  </defs>

  <!-- Page background: mirrors the survey's charcoal gradient. -->
  <rect width="1200" height="630" fill="url(#pageGlow)"/>

  <!-- One compact brand shell rather than separate floating elements. -->
  <rect x="95" y="62" width="1010" height="506" rx="32"
        fill="url(#card)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"
        filter="url(#cardShadow)"/>
  <rect x="96" y="63" width="1008" height="504" rx="31"
        fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="4"/>

  <!-- Brand mark and project label. -->
  <g transform="translate(600, 125)">
    <g transform="translate(-25, -25) scale(0.25)" fill="none" stroke="#f6f3ee"
       stroke-width="12" stroke-linecap="square" stroke-linejoin="miter">
      <polygon points="50,40 150,40 180,100 150,160 50,160 20,100"/>
      <line x1="60" y1="160" x2="60" y2="80"/>
      <line x1="80" y1="160" x2="80" y2="60"/>
      <line x1="100" y1="160" x2="100" y2="100"/>
      <line x1="120" y1="160" x2="120" y2="70"/>
      <line x1="140" y1="160" x2="140" y2="90"/>
      <line x1="50" y1="160" x2="150" y2="160"/>
    </g>
  </g>
  <text x="600" y="186" text-anchor="middle"
        font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18"
        font-weight="bold" letter-spacing="4.2" fill="#c9c5bf">SA ECONOMY SURVEY</text>

  <!-- Centered title and supporting copy. -->
  <g font-family="DejaVu Sans, Liberation Sans, sans-serif" font-weight="bold"
     font-size="58" fill="#f6f3ee" text-anchor="middle">
    <text x="600" y="278">Putting the South African</text>
    <text x="600" y="347">Economy Into Perspective</text>
  </g>
  <text x="600" y="402" text-anchor="middle"
        font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="27"
        fill="#c9c5bf">Cost of living, work pressure, and economic strain.</text>

  <!-- Compact metadata row. -->
  <g font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="17"
     font-weight="bold" letter-spacing="2" fill="#f6f3ee">
    <g transform="translate(286, 444)">
      <rect width="180" height="48" rx="24" fill="#ffffff" fill-opacity="0.045"
            stroke="#ffffff" stroke-opacity="0.28"/>
      <text x="90" y="31" text-anchor="middle">ANONYMOUS</text>
    </g>
    <g transform="translate(482, 444)">
      <rect width="198" height="48" rx="24" fill="#ffffff" fill-opacity="0.045"
            stroke="#ffffff" stroke-opacity="0.28"/>
      <text x="99" y="31" text-anchor="middle">3–5 MINUTES</text>
    </g>
    <g transform="translate(696, 444)">
      <rect width="178" height="48" rx="24" fill="#ffffff" fill-opacity="0.045"
            stroke="#ffffff" stroke-opacity="0.28"/>
      <text x="89" y="31" text-anchor="middle">NO SIGN-UP</text>
    </g>
  </g>

  <text x="600" y="535" text-anchor="middle"
        font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="19"
        font-weight="bold" letter-spacing="3.4" fill="#9c9c9c">SURVEYAPP.INK</text>
</svg>
